<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude 3モデル比較｜猛暑分析</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: #f0ede8;
      min-height: 100vh;
    }

    /* ── ヘッダー ── */
    header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 14px 24px;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    header h1 { font-size: 15px; color: #222; font-weight: 700; }
    header p  { font-size: 12px; color: #999; }

    /* ── タブバー ── */
    .tab-bar {
      display: flex;
      background: #f5f5f3;
      border-bottom: 1px solid #ddd;
    }
    .tab {
      flex: 1;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-right: 1px solid #ddd;
    }
    .tab:last-child { border-right: none; }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%; flex-shrink: 0;
    }
    .sonnet .dot { background: #2563eb; }
    .fable  .dot { background: #7c3aed; }
    .opus   .dot { background: #16a34a; }
    .tab-model { font-size: 13px; font-weight: 700; color: #222; }
    .tab-desc  { font-size: 11px; color: #999; }

    /* ── 3列 ── */
    .cols {
      display: flex;
      height: calc(100vh - 90px);
    }
    .col {
      flex: 1;
      overflow-y: auto;
      border-right: 1px solid #ddd;
      background: #fff;
      padding: 28px 26px 48px;
    }
    .col:last-child { border-right: none; }

    /* ── Markdownスタイル ── */
    .col h1 {
      font-size: 17px;
      font-weight: 700;
      color: #111;
      margin: 0 0 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid #eee;
      line-height: 1.5;
    }
    .col h2 {
      font-size: 14px;
      font-weight: 700;
      color: #222;
      margin: 22px 0 10px;
      padding-left: 8px;
      border-left: 3px solid #ccc;
    }
    .sonnet-col h2 { border-color: #2563eb; }
    .fable-col  h2 { border-color: #7c3aed; }
    .opus-col   h2 { border-color: #16a34a; }

    .col h3 {
      font-size: 13px;
      font-weight: 700;
      color: #333;
      margin: 16px 0 7px;
    }
    .col p {
      font-size: 13px;
      line-height: 1.8;
      color: #444;
      margin-bottom: 10px;
    }
    .col ul, .col ol {
      padding-left: 18px;
      margin-bottom: 10px;
    }
    .col li {
      font-size: 13px;
      line-height: 1.8;
      color: #444;
      margin-bottom: 4px;
    }
    .col strong { color: #222; }
    .col em     { color: #777; }
    .col hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 18px 0;
    }
    .col blockquote {
      border-left: 3px solid #ddd;
      padding: 6px 14px;
      margin: 10px 0;
      color: #777;
      font-size: 12.5px;
    }
    .col table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin: 12px 0;
    }
    .col th {
      background: #f5f5f5;
      padding: 7px 10px;
      text-align: left;
      border: 1px solid #ddd;
      font-weight: 700;
    }
    .col td {
      padding: 6px 10px;
      border: 1px solid #ddd;
      line-height: 1.6;
    }
    .col tr:nth-child(even) td { background: #fafafa; }

    /* ── ローディング ── */
    .loading {
      color: #bbb;
      font-size: 13px;
      margin-top: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>Claude 3モデル比較 ── 猛暑の要因と対策</h1>
  <p>同じ質問を Sonnet 5 / Fable 5 / Opus 5 に投げた結果を並べて表示しています</p>
</header>

<div class="tab-bar">
  <div class="tab sonnet">
    <span class="dot"></span>
    <span class="tab-model">Sonnet 5</span>
    <span class="tab-desc">手際のいい助手</span>
  </div>
  <div class="tab fable">
    <span class="dot"></span>
    <span class="tab-model">Fable 5</span>
    <span class="tab-desc">バランス型の編集者</span>
  </div>
  <div class="tab opus">
    <span class="dot"></span>
    <span class="tab-model">Opus 5</span>
    <span class="tab-desc">独自調査をする研究者</span>
  </div>
</div>

<div class="cols">
  <div class="col sonnet-col" id="col-sonnet"><p class="loading">読み込み中…</p></div>
  <div class="col fable-col"  id="col-fable" ><p class="loading">読み込み中…</p></div>
  <div class="col opus-col"   id="col-opus"  ><p class="loading">読み込み中…</p></div>
</div>

<script>
  marked.setOptions({ breaks: true });

  const files = [
    { id: 'col-sonnet', src: 'sonnet5.md' },
    { id: 'col-fable',  src: 'fable5.md'  },
    { id: 'col-opus',   src: 'opus5.md'   },
  ];

  files.forEach(({ id, src }) => {
    fetch(src)
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      })
      .then(md => {
        document.getElementById(id).innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById(id).innerHTML =
          `<p class="loading">読み込みエラー: ${err.message}</p>`;
      });
  });
</script>

</body>
</html>
